<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TFA - Bargoin Célia</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <link rel="stylesheet" href="styles/app.css">
    <script src="scripts/app.js" defer></script>

    <meta name="description" content="Sur cette page d'accueil vous avez accès à mes 4 page du projets">
    <!-- Open Graph data -->
    <meta property="og:site_name" content="TFA">
    <meta property="og:title" content="TFA - Bargoin Célia">
    <meta property="og:description" content="Sur cette page d'accueil vous avez accès à mes 4 page du projets">
    <meta property="og:type" content="website">
    <meta property="og:url" content="http://www.celia-bargoin.be/projets/tfa/index.html">
    <meta property="og:image" content="https://celia-bargoin.be/projets/tfa/assets/img/image-partage-tfa.png">
    <meta property="og:image:width" content="1800">
    <meta property="og:image:height" content="945">
  </head>
<body class="body">
  <div class="scene">
    <h1 class="signature">Be the driver</h1>
    <div class="node pos-1" id="career">
      <div class="dot"></div>
      <div class="label"><a href="racecareer.html">Race Career</a></div>
      <svg class="connector-svg"><path class="line" id="path-career" d="M 0 0 L 0 0" /></svg>
    </div>
    <div class="node pos-2" id="paddock">
      <div class="dot"></div>
      <div class="label"><a href="paddockexperience.html">Paddock experience</a></div>
      <svg class="connector-svg"><path class="line" id="path-paddock" d="M 0 0 L 0 0" /></svg>
    </div>
    <div class="node pos-3" id="setup">
      <div class="dot"></div>
      <div class="label"><a href="racesetup.html">Race setup</a></div>
      <svg class="connector-svg"><path class="line" id="path-setup" d="M 0 0 L 0 0" /></svg>
    </div>
    <div class="node pos-4" id="impact">
      <div class="dot"></div>
      <div class="label"><a href="raceimpact.html">Race impact</a></div>
      <svg class="connector-svg"><path class="line" id="path-impact" d="M 0 0 L 0 0" /></svg>
    </div>
    <div class="car-placeholder" id="car"><img src="assets/img/F1.svg" alt="image du formule 1 ou c'est juste le contour de la F1 qui est dessiner"></div>
  </div>
</body>
</html>
