<body class="body">
  <div class="scene">
    <p class="p__accueil">Naviguez entre les points et survolez-les pour découvrir l’expérience “be the driver” en détails</p>
    <h1 class="signature">Be the driver</h1>
    <div class="node" id="career">
      <div class="dot"></div>
      <div class="label"><a href="racecareer.html">Race Career</a></div>
      <svg class="connector-svg"><path class="line" id="path-career"/></svg>
    </div>
    <div class="node" id="paddock">
      <div class="dot"></div>
      <div class="label"><a href="paddockexperience.html">Paddock experience</a></div>
      <svg class="connector-svg"><path class="line" id="path-paddock"/></svg>
    </div>
    <div class="node" id="setup">
      <div class="dot"></div>
      <div class="label"><a href="racesetup.html">Race setup</a></div>
      <svg class="connector-svg"><path class="line" id="path-setup"/></svg>
    </div>
    <div class="node" id="impact">
      <div class="dot"></div>
      <div class="label"><a href="raceimpact.html">Race impact</a></div>
      <svg class="connector-svg"><path class="line" id="path-impact"/></svg>
    </div>
    <div class="car-placeholder" id="car"><img src="assets/img/F1.svg" alt="image du formule 1 ou c'est juste le contour de la F1 qui est dessiner"></div>
  </div>
  <div class="zoom__overlay" id="zoomOverlay"></div>
