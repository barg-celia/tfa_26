<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TFA - Bargoin Célia</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <link rel="stylesheet" href="styles/app.css">
    <script src="scripts/app.js" defer></script>

    <meta name="description" content="Sur cette page d'accueil vous avez accès à mes 4 page du projets">
    <!-- Open Graph data -->
    <meta property="og:site_name" content="TFA">
    <meta property="og:title" content="TFA - Bargoin Célia">
    <meta property="og:description" content="Sur cette page d'accueil vous avez accès à mes 4 page du projets">

    <meta property="og:url" content="http://www.celia-bargoin.be/projets/tfa/index.html">
    <meta property="og:image" content="https://celia-bargoin.be/projets/tfa/assets/img/image-partage-tfa.png">

<body class="body">
   <div class="scene">
        <div class="car-target"><img src="F1_r.svg" alt="" class="f1"></div>
        <div class="node" id="impact">
            <div class="dot"></div>
            <div class="label">RACE IMPACT</div>
            
            <svg class="connector-svg" width="300" height="200">
                <path class="line" d="M 0 0 L 300 150" /> 
            </svg>
        </div>
        <div class="node" id="paddock">
            <div class="dot"></div>
            <div class="label">PADDOCK EXPERIENCE</div>
            
            <svg class="connector-svg" width="300" height="200">
                <path class="line" d="M 300 0 L 0 90" /> 
            </svg>
        </div>
        <div class="node" id="setup">
            <div class="dot"></div>
            <div class="label">RACE SETUP</div>
            
            <svg class="connector-svg" width="300" height="200">
                <path class="line" d="M 0 80 L 250 0" />
            </svg>
        </div>
        <div class="node" id="career">
            <div class="dot"></div>
            <div class="label">RACE CAREER</div>
            
            <svg class="connector-svg" width="300" height="200">
                <path class="line" d="M 200 20 L 40 170" /> 
            </svg>
        </div>

        <h1>Be the driver</h1>
    </div>
</body>
</html>
